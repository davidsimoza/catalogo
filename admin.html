<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; padding: 20px; }
    .container { max-width: 450px; margin: 30px auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    input, textarea, button { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Pega aquí exactamente las mismas credenciales de Firebase del Paso 1
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      projectId: "TU_PROYECTO_ID",
      storageBucket: "TU_PROYECTO.appspot.com",
      messagingSenderId: "NUMERO",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("formPerfume").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById("btnGuardar");
      btn.innerText = "Guardando...";
      btn.disabled = true;

      try {
        await addDoc(collection(db, "perfumes"), {
          nombre: document.getElementById("nombre").value,
          precio: document.getElementById("precio").value,
          imagen: document.getElementById("imagen").value,
          descripcion: document.getElementById("descripcion").value
        });

        alert("¡Perfume agregado con éxito!");
        document.getElementById("formPerfume").reset();
      } catch (error) {
        alert("Error al guardar: " + error.message);
      } finally {
        btn.innerText = "Guardar Perfume";
        btn.disabled = false;
      }
    });
  </script>
</head>
<body>
  <div class="container">
    <h2>Agregar Perfume</h2>
    <form id="formPerfume">
      <label>Nombre del Perfume:</label>
      <input type="text" id="nombre" placeholder="Ej: Chanel No. 5" required>
      
      <label>Precio ($):</label>
      <input type="number" id="precio" step="0.01" placeholder="Ej: 85.00" required>
      
      <label>Enlace de la Foto (URL):</label>
      <input type="url" id="imagen" placeholder="https://sitio.com/foto.jpg" required>
      
      <label>Notas / Descripción:</label>
      <textarea id="descripcion" rows="3" placeholder="Ej: Notas florales, jazmín y rosa..." required></textarea>
      
      <button type="submit" id="btnGuardar">Guardar Perfume</button>
    </form>
  </div>
</body>
</html>
